<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HITSTERHOOT · Unirse</title>
  <link rel="stylesheet" href="/public/styles/theme.css">
  <style>
    .timer{font:400 64px/1 var(--d);color:var(--pink);margin:0}
    .timer.low{color:#b4133f}
    .bar{height:12px;border:3px solid var(--deep);border-radius:99px;overflow:hidden;margin:10px 0 18px}
    .bar>i{display:block;height:100%;background:var(--mint);transform-origin:left}
    .yearbox{font:400 78px/1 var(--d);color:var(--deep);text-shadow:4px 4px 0 var(--sun);margin:6px 0 14px}
    .yearlabel{font-weight:800;opacity:.7}
    input[type=range]{width:100%;accent-color:var(--pink);height:36px}
    .stepper{display:flex;gap:8px;justify-content:center;margin-top:6px}
    .mini{font:800 18px var(--b);flex:1;padding:10px 0;border:3px solid var(--deep);border-radius:12px;background:var(--sun);color:var(--deep);cursor:pointer}
    .mini:active{background:var(--mint)}
    .pts{font:400 44px var(--d);color:var(--pink);margin-top:4px}
    .lb{list-style:none;margin:0;padding:0;text-align:left}
    .lb li{display:flex;gap:10px;padding:9px 4px;border-bottom:2px dashed rgba(7,26,23,.2);font-weight:800}
    .lb li:last-child{border:0}.lb .pos{font:400 20px var(--d);color:var(--pink);width:30px}
    .lb .nm{flex:1}.lb .me{background:rgba(255,228,94,.5);border-radius:8px}
  </style>
</head>
<body>
  <header class="top">
    <div class="vinyl"></div>
    <div class="brand">HITSTERHOOT<b>!</b></div>
    <div class="eq"><i></i><i></i><i></i><i></i></div>
    <span class="tag hidden" id="hdr-code"></span>
  </header>

  <main>
    <div class="panel" id="join" style="max-width:380px;margin:0 auto">
      <h2>¿En qué año sonó?</h2>
      <input class="in" id="code" inputmode="numeric" maxlength="4" placeholder="Código de sala">
      <input class="in" id="name" maxlength="20" placeholder="Tu nombre">
      <div class="err" id="error"></div>
      <button class="btn" id="btn">Entrar a la sala</button>
    </div>

    <div class="panel hidden" id="lobby" style="max-width:380px;margin:0 auto">
      <div class="vinyl big" style="margin:0 auto 16px"></div>
      <h2 id="welcome"></h2>
      <p id="msg">Estás dentro. Espera a que el anfitrión inicie la partida.</p>
    </div>

    <div class="hidden" id="game" style="max-width:420px;margin:0 auto;text-align:center">
      <div class="status" id="status"></div>

      <div class="panel hidden" id="guessing">
        <div class="timer" id="timer">20</div>
        <div class="bar"><i id="bar"></i></div>
        <div class="yearbox" id="yearbig">2000</div>
        <input type="range" id="slider" step="1">
        <div class="stepper">
          <button class="mini" data-d="-10">−10</button><button class="mini" data-d="-1">−1</button>
          <button class="mini" data-d="1">+1</button><button class="mini" data-d="10">+10</button>
        </div>
        <button class="btn" id="lock" style="margin-top:14px">Enviar respuesta</button>
      </div>

      <div class="panel hidden" id="waiting">
        <div class="vinyl big" style="margin:0 auto 12px"></div>
        <h2 id="waittitle">Respuesta enviada</h2>
        <p id="waitmsg">Esperando a los demás…</p>
      </div>

      <div class="panel hidden" id="result">
        <div class="yearlabel">Fue en</div>
        <div class="yearbox" id="answer"></div>
        <p id="songinfo" style="margin:4px 0 14px"></p>
        <div id="yourguess" style="font-weight:800"></div>
        <div class="pts" id="pts"></div>
        <div id="rank" style="margin-top:8px;font-weight:600"></div>
        <p id="nextmsg" style="opacity:.7;margin:14px 0 0"></p>
      </div>

      <div class="panel hidden" id="final">
        <h2 id="finaltitle"></h2>
        <ol class="lb" id="finalboard"></ol>
      </div>
    </div>
  </main>

  <footer class="foot">
    <div class="ruler"><div class="track">
      <span>1950</span><span>1960</span><span>1970</span><span>1980</span><span>1990</span><span>2000</span><span>2010</span><span>2020</span>
      <span>1950</span><span>1960</span><span>1970</span><span>1980</span><span>1990</span><span>2000</span><span>2010</span><span>2020</span>
    </div></div>
    <div class="needle"></div>
    <p>© Loera Labs</p>  </footer>

  <script>
    const $ = (id) => document.getElementById(id);
    const proto = location.protocol === 'https:' ? 'wss' : 'ws';
    let ws, me = '';

    const show = (id) => ['join', 'lobby', 'game'].forEach((k) => $(k).classList.toggle('hidden', k !== id));
    const panel = (id) => ['guessing', 'waiting', 'result', 'final'].forEach((k) => $(k).classList.toggle('hidden', k !== id));
    const esc = (t) => Object.assign(document.createElement('i'), { textContent: t }).innerHTML;

    let ticker = null, guess = 2000, locked = false;
    const slider = $('slider');

    function setGuess(y) {
      guess = Math.min(Number(slider.max), Math.max(Number(slider.min), y));
      slider.value = guess;
      $('yearbig').textContent = guess;
    }
    slider.oninput = () => setGuess(Number(slider.value));
    document.querySelector('.stepper').onclick = (e) => {
      const b = e.target.closest('.mini');
      if (b && !locked) setGuess(guess + Number(b.dataset.d));
    };

    function countdown(seconds) {
      clearInterval(ticker);
      const t0 = performance.now(), total = seconds * 1000;
      const tick = () => {
        const left = Math.max(0, total - (performance.now() - t0));
        $('timer').textContent = Math.ceil(left / 1000);
        $('timer').classList.toggle('low', left <= 5000);
        $('bar').style.transform = `scaleX(${left / total})`;
        if (left <= 0) clearInterval(ticker);
      };
      tick();
      ticker = setInterval(tick, 100);
    }

    function startRound(m) {
      locked = false;
      slider.min = m.min; slider.max = m.max;
      setGuess(1990);
      $('lock').disabled = false;
      $('status').textContent = `Ronda ${m.round} de ${m.total}`;
      panel('guessing');
      countdown(m.seconds);
    }

    function endRound(m) {
      clearInterval(ticker);
      $('status').textContent = `Ronda ${m.round} de ${m.total}`;
      $('answer').textContent = m.year;
      $('songinfo').innerHTML = `<strong>${esc(m.song.name)}</strong><br>${esc(m.song.artist)}`;
      $('yourguess').textContent = m.guess === null ? 'No contestaste a tiempo' : `Tu respuesta: ${m.guess} (${m.guess === m.year ? '¡exacto!' : `${Math.abs(m.guess - m.year)} ${Math.abs(m.guess - m.year) === 1 ? 'año' : 'años'} de diferencia`})`;
      $('pts').textContent = `+${m.points}`;
      $('rank').textContent = `Llevas ${m.score} puntos · lugar ${m.rank}`;
      $('nextmsg').textContent = m.last ? 'Esperando el resultado final…' : 'Prepárate, viene la siguiente canción…';
      panel('result');
    }

    function finish(m) {
      clearInterval(ticker);
      $('status').textContent = '¡Se acabó la partida!';
      const board = m.leaderboard;
      const mine = board.findIndex((p) => p.name === me) + 1;
      $('finaltitle').textContent = mine === 1 ? '¡Ganaste! 🎉' : `Quedaste en el lugar ${mine}`;
      $('finalboard').innerHTML = board.map((p, i) => `<li class="${p.name === me ? 'me' : ''}"><span class="pos">${i + 1}</span><span class="nm">${esc(p.name)}</span><span>${p.score}</span></li>`).join('');
      panel('final');
    }

    function connect(then) {
      ws = new WebSocket(`${proto}://${location.host}`);
      ws.onopen = then;

      ws.onmessage = (e) => {
        const msg = JSON.parse(e.data);

        if (msg.type === 'error') $('error').textContent = msg.message;

        if (msg.type === 'joined') {
          me = msg.name;
          show('lobby');
          $('welcome').textContent = `Hola, ${msg.name}`;
          $('hdr-code').textContent = `Sala ${msg.code}`;
          $('hdr-code').classList.remove('hidden');
        }

        if (msg.type === 'started') { $('msg').textContent = 'Empezó el juego. ¡Prepárate!'; }
        if (msg.type === 'round_start') { show('game'); startRound(msg); }
        if (msg.type === 'guess_ok') {
          locked = true;
          $('waitmsg').textContent = `Tu respuesta: ${msg.year}. Esperando a los demás…`;
          panel('waiting');
        }
        if (msg.type === 'round_end') { show('game'); endRound(msg); }
        if (msg.type === 'game_over') finish(msg);
        if (msg.type === 'room_closed') {
          show('lobby');
          $('msg').textContent = 'El anfitrión cerró la sala.';
        }
      };

      ws.onclose = () => {
        if (!$('join').classList.contains('hidden')) return;
        show('lobby');
        $('msg').textContent = 'Desconectado. Recarga para volver a entrar.';
      };
    }

    $('lock').onclick = () => {
      if (locked) return;
      $('lock').disabled = true;
      ws.send(JSON.stringify({ type: 'guess', year: guess }));
    };

    $('btn').onclick = () => {
      $('error').textContent = '';
      const code = $('code').value.trim();
      const name = $('name').value.trim();
      if (!code || !name) { $('error').textContent = 'Completa código y nombre'; return; }

      const sendJoin = () => ws.send(JSON.stringify({ type: 'join', code, name }));
      if (ws && ws.readyState === WebSocket.OPEN) sendJoin();
      else connect(sendJoin);
    };
  </script>
</body>
</html>
