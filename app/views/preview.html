<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Random song preview</title>
</head>
<body>
  <div class="card">
    <h2>🎵 Random song</h2>

    <button id="play">▶ Play a song</button>
    <audio id="audio" controls></audio>

    <button id="reveal" class="secondary" disabled>Reveal answer</button>
    <div id="info"></div>
    <div id="error"></div>
  </div>

  <script>
    // Change this if your Express server runs somewhere else
    const API = 'http://localhost:4000';

    const $ = (id) => document.getElementById(id);
    const audio = $('audio');
    let track = null;

    $('play').onclick = async () => {
      $('error').textContent = '';
      $('info').textContent = 'Finding a song…';
      $('reveal').disabled = true;
      $('play').disabled = true;
      audio.pause();

      try {
        const res = await fetch(`${API}/random-song`);
        track = await res.json();
        if (track.error) throw new Error(track.error);

        audio.src = track.previewUrl;
        await audio.play(); // plays the full ~30 s preview
        $('info').textContent = '🎧 Listening…';
        $('reveal').disabled = false;
      } catch (err) {
        $('info').textContent = '';
        $('error').textContent = 'Error: ' + err.message;
      } finally {
        $('play').disabled = false;
      }
    };

    $('reveal').onclick = () => {
      if (!track) return;
      $('info').textContent = `${track.name} — ${track.artist} (${track.year})`;
    };
  </script>
</body>
</html>
