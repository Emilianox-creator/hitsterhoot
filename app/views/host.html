<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rebobina · Host</title>
  <link rel="stylesheet" href="/public/styles/theme.css">
  <style>
    .code{display:inline-block;font:400 clamp(64px,16vw,130px)/1 var(--d);letter-spacing:.12em;padding:10px 0 10px .12em;
      background:var(--sun);color:var(--deep);border:4px solid var(--deep);border-radius:22px;box-shadow:10px 10px 0 var(--pink);transform:rotate(-2deg);margin:22px 0}
    .pills{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:20px 0;min-height:48px}
    .pill{padding:8px 20px;border-radius:99px;font-weight:800;font-size:20px;background:var(--mint);color:var(--deep);border:3px solid var(--deep)}
    .pill:nth-child(3n+1){background:var(--pink)}.pill:nth-child(3n+2){background:var(--sun)}
    .stage{display:flex;gap:28px;align-items:center;justify-content:center;flex-wrap:wrap;margin-bottom:28px}
    .row{padding:12px 14px;margin-bottom:12px;border:3px solid rgba(255,246,227,.2);border-radius:18px}
    .row.on{border-color:var(--sun);background:rgba(255,228,94,.08)}
    .row h3{font-size:20px;display:flex;justify-content:space-between;margin:0 0 8px}
    .row small{font:600 16px var(--b);opacity:.8}
    .strip{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 10px}
    .strip .sleeve{width:112px;min-height:96px;font-size:12px}.strip .sleeve strong{font-size:26px}
    .ok{display:block;margin:0 auto}
  </style>
</head>
<body>
  <header class="top">
    <div class="vinyl"></div>
    <div class="brand">HITSTERHOOT<b>!</b></div>
    <div class="eq"><i></i><i></i><i></i><i></i></div>
    <span class="tag hidden" id="hdr-code"></span>
  </header>

  <main>
    <section id="lobby" style="text-align:center">
      <h1>Entra desde tu celular</h1>
      <div id="url" style="font-size:20px;opacity:.85"></div>
      <div class="code" id="code">····</div>
      <div>Jugadores: <strong id="count">0</strong></div>
      <div class="pills" id="players"></div>
      <button class="btn ok" id="start" style="max-width:340px" disabled>Empezar partida</button>
      <div id="status" style="margin-top:16px;opacity:.8">Conectando…</div>
    </section>

    <section id="game" class="hidden">
      <div class="status" id="gstatus"></div>
      <div class="stage">
        <div class="vinyl big" id="disc"></div>
        <div id="mystery" style="width:100%;max-width:300px"></div>
      </div>
      <div id="board"></div>
      <button class="btn ok hidden" id="again" style="max-width:340px;margin-top:16px">Nueva partida</button>
    </section>
  </main>

  <footer class="foot">
    <div class="ruler"><div class="track">
      <span>1950</span><span>1960</span><span>1970</span><span>1980</span><span>1990</span><span>2000</span><span>2010</span><span>2020</span>
      <span>1950</span><span>1960</span><span>1970</span><span>1980</span><span>1990</span><span>2000</span><span>2010</span><span>2020</span>
    </div></div>
    <div class="needle"></div>
    <p>® Loera Labs</p>
  </footer>

  <script>
    const proto = location.protocol === 'https:' ? 'wss' : 'ws';
    const ws = new WebSocket(`${proto}://${location.host}`);

    const $ = (id) => document.getElementById(id);
    const esc = (t) => Object.assign(document.createElement('i'), { textContent: t }).innerHTML;
    const hue = (y) => `hsl(${(y - 1950) * 4.5} 85% 62%)`;
    const sleeve = (x) => `<div class="sleeve" style="--c:${hue(x.year)}"><span>${x.name}</span><strong>${x.year}</strong></div>`;
    $('url').textContent = `Abre ${location.origin}/ e ingresa el código`;

    function render(s) {
      $('lobby').classList.add('hidden');
      $('game').classList.remove('hidden');
      const placing = s.phase === 'placing', over = s.phase === 'over';

      $('gstatus').textContent =
        over ? `¡Ganó ${s.winner || 'nadie'}!` :
        placing ? `Turno de ${s.turn}` :
        `${s.result.name} ${s.result.correct ? 'acertó' : 'falló'}`;

      $('disc').classList.toggle('paused', !placing);
      $('mystery').innerHTML = `<div class="sleeve mystery" style="--c:${placing ? 'var(--paper)' : hue(s.song.year)}">
        <span>${s.song.name}</span><strong>${placing ? '????' : s.song.year}</strong></div>`;

      $('board').innerHTML = s.players.map((p) => `<div class="row ${p.name === s.turn && !over ? 'on' : ''}">
        <h3><span>${esc(p.name)}</span><small>${p.timeline.length} de ${s.goal}</small></h3>
        <div class="strip">${p.timeline.map(sleeve).join('')}</div></div>`).join('');

      $('again').classList.toggle('hidden', !over);
    }

    ws.onopen = () => ws.send(JSON.stringify({ type: 'create_room' }));

    ws.onmessage = (e) => {
      const msg = JSON.parse(e.data);

      if (msg.type === 'room_created') {
        $('code').textContent = msg.code;
        $('hdr-code').textContent = `Sala ${msg.code}`;
        $('hdr-code').classList.remove('hidden');
        $('status').textContent = 'Esperando jugadores…';
      }

      if (msg.type === 'players') {
        $('count').textContent = msg.players.length;
        $('players').innerHTML = msg.players.map((n) => `<div class="pill">${esc(n)}</div>`).join('');
        $('start').disabled = msg.players.length === 0;
      }

      if (msg.type === 'state') render(msg);
    };

    ws.onclose = () => { $('status').textContent = 'Conexión cerrada. Recarga la página.'; };

    $('start').onclick = () => ws.send(JSON.stringify({ type: 'start' }));
    $('again').onclick = () => location.reload();
  </script>
</body>
</html>
